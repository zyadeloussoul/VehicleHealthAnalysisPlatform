spring.application.name=telemetry-service

server.port=8081



spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://telemetry-db:5433/telemetry_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:telemetry_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:telemetry_password}


spring.jpa.hibernate.ddl-auto=validate


spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false
logging.level.org.flywaydb=DEBUG
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration