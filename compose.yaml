services:

  # =========================================================
  # TELEMETRY DATABASE
  # =========================================================
  telemetry-db:
    image: postgres:latest
    container_name: telemetry-db

    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_password

    ports:
      - "5433:5432"

    volumes:
      - telemetry-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_user -d telemetry_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # =========================================================
  # VEHICLE ANALYSIS DATABASE
  # =========================================================
  analysis-db:
    image: postgres:18
    container_name: analysis-db

    environment:
      POSTGRES_DB: vehicle_analysis_db
      POSTGRES_USER: analysis_user
      POSTGRES_PASSWORD: analysis_password

    ports:
      - "5434:5432"

    volumes:
      - analysis-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analysis_user -d vehicle_analysis_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # =========================================================
  # APACHE KAFKA - SINGLE NODE / KRAFT
  # =========================================================
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 1

    volumes:
      - kafka-data:/var/lib/kafka/data


  # =========================================================
  # EXTERNAL RECALL API MOCK
  # =========================================================
  recall-api-mock:
    image: wiremock/wiremock:3.13.2
    container_name: recall-api-mock

    ports:
      - "8090:8080"

    volumes:
      - ./wiremock:/home/wiremock


  # =========================================================
  # TELEMETRY SERVICE
  # =========================================================
  telemetry-service:
    build:
      context: .
      dockerfile: telemetry-service/Dockerfile

    container_name: telemetry-service

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://telemetry-db:5432/telemetry_db
      SPRING_DATASOURCE_USERNAME: telemetry_user
      SPRING_DATASOURCE_PASSWORD: telemetry_password

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      telemetry-db:
        condition: service_healthy

      kafka:
        condition: service_started


  # =========================================================
  # VEHICLE ANALYSIS SERVICE
  # =========================================================
  vehicle-analysis-service:
    build:
      context: .
      dockerfile: vehicle-analysis-service/Dockerfile

    container_name: vehicle-analysis-service

    ports:
      - "8082:8082"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://analysis-db:5432/vehicle_analysis_db
      SPRING_DATASOURCE_USERNAME: analysis_user
      SPRING_DATASOURCE_PASSWORD: analysis_password

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      EXTERNAL_RECALL_API_BASE_URL: http://recall-api-mock:8080

    depends_on:
      analysis-db:
        condition: service_healthy

      kafka:
        condition: service_started

      recall-api-mock:
        condition: service_started


# =========================================================
# PERSISTENT VOLUMES
# =========================================================
volumes:

  telemetry-data:

  analysis-data:

  kafka-data:
