spring.application.name=vehicle-analysis-service

server.port=8082

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:vehicle_analysis_db:9092}

spring.kafka.consumer.group-id=vehicle-analysis-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.properties.spring.json.value.default.type=org.vehicle_health_analysis_platform.vehicleanalysisservice.infrastructure.messaging.TelemetryReceivedEvent



vehicle.health.tire.recommended-pressure=2.4


external.recall-api.base-url=${EXTERNAL_RECALL_API_BASE_URL:http://localhost:8090}



spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://analysis-db:5434/vehicle_analysis_db}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:analysis_user}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:analysis_password}



spring.jpa.hibernate.ddl-auto=validate
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG
