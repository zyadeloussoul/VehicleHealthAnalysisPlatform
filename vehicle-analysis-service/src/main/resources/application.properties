spring.application.name=vehicle-analysis-service

server.port=8082

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=vehicle-analysis-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=org.vehicle_health_analysis_platform.vehicleanalysis.infrastructure.messaging.TelemetryReceivedEvent
vehicle.health.tire.recommended-pressure=2.4
external.recall-api.base-url=http://localhost:8090